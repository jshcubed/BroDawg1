<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flappy-chan ✨</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #1a1030;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .frame {
    position: relative;
    box-shadow: 0 0 60px rgba(255, 150, 220, 0.4);
    border-radius: 16px;
    overflow: hidden;
  }
  canvas { display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none;
  }
  .overlay.hidden { display: none; }
  .title {
    font-size: 2.6rem;
    font-weight: 800;
    color: #ffd6f0;
    letter-spacing: 1px;
  }
  .sub { font-size: 1rem; margin-top: 0.5rem; color: #fff0fa; }
  .hint {
    margin-top: 1.5rem;
    font-size: 0.95rem;
    background: rgba(255,120,200,0.35);
    padding: 0.6rem 1.2rem;
    border-radius: 999px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .big-score { font-size: 4rem; font-weight: 800; color: #fff; }
  .best { margin-top: 0.5rem; color: #ffd6f0; font-size: 1.1rem; }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.06); opacity: 1; }
  }
</style>
</head>
<body>
<div class="frame">
  <canvas id="game" width="400" height="600"></canvas>

  <div class="overlay" id="start-overlay">
    <div class="title">Flappy-chan</div>
    <div class="sub">✨ help her fly through the sky ✨</div>
    <div class="hint">Tap / Click / Space to flap</div>
  </div>

  <div class="overlay hidden" id="over-overlay">
    <div class="title" style="font-size:2rem;">You fell! 💫</div>
    <div class="big-score" id="final-score">0</div>
    <div class="best" id="best-score">Best: 0</div>
    <div class="hint">Tap to try again</div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const startOverlay = document.getElementById("start-overlay");
const overOverlay = document.getElementById("over-overlay");
const finalScoreEl = document.getElementById("final-score");
const bestScoreEl = document.getElementById("best-score");

// --- Game state ---
let state = "start"; // start, playing, over
let score = 0;
let best = parseInt(localStorage.getItem("flappyBest") || "0");

// --- Character ---
const bird = {
  x: 100, y: H / 2, r: 16,
  vy: 0,
  flap: -7,
  gravity: 0.4,
  wingPhase: 0,
};

// --- Pipes (torii gates) ---
const GAP = 160;
const PIPE_W = 60;
const PIPE_SPEED = 2.4;
let pipes = [];
let frame = 0;

// --- Sakura petals (background) ---
const petals = [];
for (let i = 0; i < 25; i++) {
  petals.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: 4 + Math.random() * 5,
    speed: 0.4 + Math.random() * 0.8,
    sway: Math.random() * Math.PI * 2,
  });
}

function reset() {
  bird.y = H / 2;
  bird.vy = 0;
  pipes = [];
  frame = 0;
  score = 0;
}

function flap() {
  if (state === "start") {
    state = "playing";
    startOverlay.classList.add("hidden");
    reset();
  } else if (state === "playing") {
    bird.vy = bird.flap;
  } else if (state === "over") {
    state = "start";
    overOverlay.classList.add("hidden");
    startOverlay.classList.remove("hidden");
  }
}

// Input
function onInput(e) { e.preventDefault(); flap(); }
canvas.addEventListener("mousedown", onInput);
canvas.addEventListener("touchstart", onInput, { passive: false });
document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); flap(); }
});

function spawnPipe() {
  const minTop = 60;
  const maxTop = H - GAP - 120;
  const top = minTop + Math.random() * (maxTop - minTop);
  pipes.push({ x: W, top: top, scored: false });
}

function gameOver() {
  state = "over";
  if (score > best) {
    best = score;
    localStorage.setItem("flappyBest", best);
  }
  finalScoreEl.textContent = score;
  bestScoreEl.textContent = "Best: " + best;
  overOverlay.classList.remove("hidden");
}

// --- Drawing ---
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#ffb3d9");
  grad.addColorStop(0.5, "#c9a3ff");
  grad.addColorStop(1, "#a3d5ff");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Sun / moon glow
  ctx.fillStyle = "rgba(255, 250, 230, 0.7)";
  ctx.beginPath();
  ctx.arc(320, 110, 50, 0, Math.PI * 2);
  ctx.fill();

  // Distant clouds
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  drawCloud(80, 150, 1);
  drawCloud(250, 250, 0.8);
  drawCloud(150, 400, 1.2);
}

function drawCloud(x, y, s) {
  ctx.beginPath();
  ctx.arc(x, y, 20*s, 0, Math.PI*2);
  ctx.arc(x+22*s, y+5*s, 26*s, 0, Math.PI*2);
  ctx.arc(x+50*s, y, 20*s, 0, Math.PI*2);
  ctx.fill();
}

function drawPetals() {
  ctx.fillStyle = "rgba(255, 200, 230, 0.85)";
  for (const p of petals) {
    p.y += p.speed;
    p.sway += 0.02;
    p.x += Math.sin(p.sway) * 0.5;
    if (p.y > H) { p.y = -10; p.x = Math.random() * W; }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.sway);
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPipe(p) {
  // Torii-gate styled pillars
  const drawPillar = (y, h) => {
    const g = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    g.addColorStop(0, "#e8483f");
    g.addColorStop(0.5, "#ff6b5e");
    g.addColorStop(1, "#c2362f");
    ctx.fillStyle = g;
    ctx.fillRect(p.x, y, PIPE_W, h);
    // dark trim
    ctx.fillStyle = "#3a1a1a";
    ctx.fillRect(p.x - 4, y === 0 ? p.top - 14 : y, PIPE_W + 8, 14);
  };
  drawPillar(0, p.top);
  drawPillar(p.top + GAP, H - p.top - GAP);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  const tilt = Math.max(-0.5, Math.min(1.0, bird.vy / 12));
  ctx.rotate(tilt);

  // Wing (behind body)
  bird.wingPhase += 0.3;
  const wingY = Math.sin(bird.wingPhase) * 6;
  ctx.fillStyle = "#ff9ed6";
  ctx.beginPath();
  ctx.ellipse(-6, wingY, 12, 8, -0.4, 0, Math.PI * 2);
  ctx.fill();

  // Body
  ctx.fillStyle = "#fff0f8";
  ctx.beginPath();
  ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#ff8ec9";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Hair (anime fringe)
  ctx.fillStyle = "#7b4fd4";
  ctx.beginPath();
  ctx.arc(0, -4, bird.r, Math.PI, 0);
  ctx.fill();
  // hair spikes
  ctx.beginPath();
  ctx.moveTo(-bird.r, -2);
  ctx.lineTo(-bird.r - 4, 6);
  ctx.lineTo(-bird.r + 6, 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bird.r, -2);
  ctx.lineTo(bird.r + 4, 6);
  ctx.lineTo(bird.r - 6, 2);
  ctx.fill();

  // Eyes (big anime eyes)
  ctx.fillStyle = "#3a2a5a";
  ctx.beginPath(); ctx.arc(-5, 2, 4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(7, 2, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-4, 1, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(8, 1, 1.5, 0, Math.PI * 2); ctx.fill();

  // Blush
  ctx.fillStyle = "rgba(255,150,190,0.6)";
  ctx.beginPath(); ctx.arc(-9, 7, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(11, 7, 3, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawScore() {
  ctx.fillStyle = "#fff";
  ctx.strokeStyle = "rgba(120,60,140,0.8)";
  ctx.lineWidth = 4;
  ctx.font = "bold 48px Segoe UI";
  ctx.textAlign = "center";
  ctx.strokeText(score, W / 2, 80);
  ctx.fillText(score, W / 2, 80);
}

// --- Update + Loop ---
function update() {
  if (state === "playing") {
    bird.vy += bird.gravity;
    bird.y += bird.vy;

    frame++;
    if (frame % 90 === 0) spawnPipe();

    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.scored && p.x + PIPE_W < bird.x) {
        p.scored = true;
        score++;
      }
      // collision
      if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_W) {
        if (bird.y - bird.r < p.top || bird.y + bird.r > p.top + GAP) {
          gameOver();
        }
      }
    }
    pipes = pipes.filter(p => p.x + PIPE_W > -10);

    // ground / ceiling
    if (bird.y + bird.r > H || bird.y - bird.r < 0) gameOver();
  }
}

function render() {
  drawBackground();
  drawPetals();
  for (const p of pipes) drawPipe(p);
  drawBird();
  if (state === "playing") drawScore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

bestScoreEl.textContent = "Best: " + best;
loop();
</script>
</body>
</html>
