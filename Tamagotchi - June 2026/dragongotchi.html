<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dragongotchi 🐉</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(160deg, #2a1a4a 0%, #1a1030 60%, #0d0820 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .device {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(145deg, #ff7b54, #d94f9c);
    border-radius: 40px;
    padding: 1.5rem 1.5rem 2rem;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 2px 8px rgba(255,255,255,0.3);
  }
  .brand {
    text-align: center;
    font-weight: 800;
    letter-spacing: 1px;
    color: #fff8;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
  }
  .brand b { color: #fff; }

  .screen {
    background: #cfe8c0;
    border-radius: 20px;
    padding: 1rem;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.3);
    border: 4px solid #3a2a1a;
  }

  .stage {
    height: 180px;
    background: linear-gradient(180deg, #aee0ff 0%, #d8f5d0 100%);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .dragon {
    font-size: 5rem;
    transition: transform 0.2s;
    animation: bob 2s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
  }
  .dragon.sleeping { animation: none; filter: grayscale(0.3) brightness(0.8); }
  .dragon.sick { filter: hue-rotate(80deg) brightness(0.85); }
  @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-12px);} }

  .zzz {
    position: absolute; top: 30px; right: 90px;
    font-size: 1.5rem; opacity: 0; color: #557;
    animation: float 2.5s ease-in-out infinite;
  }
  @keyframes float { 0%{opacity:0; transform: translateY(0);} 30%{opacity:1;} 100%{opacity:0; transform: translateY(-30px);} }

  .poop { position: absolute; bottom: 8px; font-size: 1.5rem; }

  .name-age {
    display: flex; justify-content: space-between;
    margin: 0.6rem 0.25rem 0.4rem;
    font-size: 0.85rem; color: #2a3a1a; font-weight: 700;
  }
  .stage-badge {
    background: #3a2a1a; color: #ffd; border-radius: 999px;
    padding: 0 0.5rem; font-size: 0.7rem;
  }

  .stats { display: flex; flex-direction: column; gap: 0.4rem; margin-top: 0.4rem; }
  .stat { display: flex; align-items: center; gap: 0.4rem; }
  .stat .label { width: 70px; font-size: 0.75rem; color: #2a3a1a; font-weight: 700; }
  .bar { flex: 1; height: 12px; background: #88996680; border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 6px; transition: width 0.4s; }
  .fill-hunger { background: #ff8c42; }
  .fill-happy  { background: #ffd23f; }
  .fill-energy { background: #4ecdc4; }
  .fill-health { background: #ff5d8f; }

  .buttons {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem; margin-top: 1.25rem;
  }
  .btn {
    border: none; border-radius: 14px;
    background: #3a2a1a; color: #fff;
    padding: 0.7rem 0.3rem; font-size: 0.8rem; font-weight: 700;
    cursor: pointer; transition: transform 0.1s, background 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
  }
  .btn span.ico { font-size: 1.3rem; }
  .btn:hover { background: #55402a; }
  .btn:active { transform: scale(0.94); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .message {
    text-align: center; margin: 0.75rem 0 0.25rem;
    min-height: 1.2rem; font-size: 0.85rem; color: #2a3a1a; font-weight: 600;
  }

  .overlay {
    position: absolute; inset: 0;
    background: rgba(20,10,30,0.92);
    border-radius: 12px;
    display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    color: #fff; padding: 1rem;
  }
  .overlay.show { display: flex; }
  .overlay h2 { color: #ff7b54; margin-bottom: 0.5rem; }
  .overlay p { font-size: 0.85rem; margin-bottom: 1rem; color: #ddd; }
  .overlay .btn { background: #ff7b54; flex-direction: row; }
</style>
</head>
<body>
<div class="device">
  <div class="brand">🐉 <b>DRAGONGOTCHI</b> 🐉</div>
  <div class="screen">
    <div class="name-age">
      <span id="pet-name">Drako</span>
      <span class="stage-badge" id="pet-stage">Egg</span>
      <span id="pet-age">Age: 0</span>
    </div>

    <div class="stage">
      <div class="zzz" id="zzz">💤</div>
      <div class="dragon" id="dragon" onclick="petDragon()">🥚</div>
      <div id="poop-area"></div>

      <div class="overlay" id="death-overlay">
        <h2>💀 Oh no…</h2>
        <p id="death-text">Your dragon has passed away.</p>
        <button class="btn" onclick="restart()">🥚 Hatch a New Dragon</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span class="label">🍖 Hunger</span><div class="bar"><div class="fill-hunger" id="bar-hunger"></div></div></div>
      <div class="stat"><span class="label">😄 Happy</span><div class="bar"><div class="fill-happy" id="bar-happy"></div></div></div>
      <div class="stat"><span class="label">⚡ Energy</span><div class="bar"><div class="fill-energy" id="bar-energy"></div></div></div>
      <div class="stat"><span class="label">❤️ Health</span><div class="bar"><div class="fill-health" id="bar-health"></div></div></div>
    </div>
  </div>

  <div class="message" id="message">Tap your egg to hatch it!</div>

  <div class="buttons">
    <button class="btn" id="btn-feed"  onclick="feed()"><span class="ico">🍖</span>Feed</button>
    <button class="btn" id="btn-play"  onclick="playWith()"><span class="ico">🎮</span>Play</button>
    <button class="btn" id="btn-sleep" onclick="toggleSleep()"><span class="ico">😴</span>Sleep</button>
    <button class="btn" id="btn-clean" onclick="clean()"><span class="ico">🧹</span>Clean</button>
    <button class="btn" id="btn-heal"  onclick="heal()"><span class="ico">💊</span>Heal</button>
    <button class="btn" id="btn-reset" onclick="confirmReset()"><span class="ico">🔄</span>Reset</button>
  </div>
</div>

<script>
// ===== Stat model (0-100) =====
const DEFAULT = {
  name: "Drako",
  born: Date.now(),
  lastTick: Date.now(),
  hunger: 80,   // higher = more full
  happy: 80,
  energy: 90,
  health: 100,
  sleeping: false,
  poops: 0,
  alive: true,
  ageMin: 0,    // age in "minutes lived"
  hatched: false,
};

let pet = load();

function load() {
  const saved = localStorage.getItem("dragongotchi");
  if (saved) {
    try { return Object.assign({}, DEFAULT, JSON.parse(saved)); }
    catch (e) { return Object.assign({}, DEFAULT); }
  }
  return Object.assign({}, DEFAULT);
}
function save() { localStorage.setItem("dragongotchi", JSON.stringify(pet)); }

// ===== Life stage based on age (minutes) =====
function lifeStage() {
  if (!pet.hatched) return { name: "Egg", emoji: "🥚" };
  if (pet.ageMin < 3)  return { name: "Baby",  emoji: "🐉" };
  if (pet.ageMin < 10) return { name: "Teen",  emoji: "🦎" };
  if (pet.ageMin < 25) return { name: "Adult", emoji: "🐲" };
  return { name: "Elder", emoji: "🐉✨" };
}

function clamp(v) { return Math.max(0, Math.min(100, v)); }

// ===== Time-based decay (also catches up after being away) =====
function tick() {
  if (!pet.alive) return;

  const now = Date.now();
  const elapsedMin = (now - pet.lastTick) / 60000;
  pet.lastTick = now;
  if (!pet.hatched) { save(); return; }

  pet.ageMin += elapsedMin;

  // decay rates per minute
  if (pet.sleeping) {
    pet.energy = clamp(pet.energy + 12 * elapsedMin);
    pet.hunger = clamp(pet.hunger - 1.5 * elapsedMin);
    if (pet.energy >= 100) { pet.sleeping = false; setMessage("Your dragon woke up refreshed! ☀️"); }
  } else {
    pet.hunger = clamp(pet.hunger - 4 * elapsedMin);
    pet.happy  = clamp(pet.happy  - 3 * elapsedMin);
    pet.energy = clamp(pet.energy - 2.5 * elapsedMin);
  }

  // random poop over time
  if (!pet.sleeping && Math.random() < 0.15 * elapsedMin + (elapsedMin > 0 ? 0.02 : 0)) {
    pet.poops = Math.min(4, pet.poops + 1);
  }

  // health suffers when needs are neglected
  let healthDrain = 0;
  if (pet.hunger <= 0) healthDrain += 5 * elapsedMin;
  if (pet.happy  <= 0) healthDrain += 3 * elapsedMin;
  if (pet.poops >= 3)  healthDrain += 4 * elapsedMin;
  if (healthDrain > 0) pet.health = clamp(pet.health - healthDrain);
  else if (pet.hunger > 50 && pet.happy > 50) pet.health = clamp(pet.health + 1 * elapsedMin);

  if (pet.health <= 0) die();
  save();
  render();
}

function die() {
  pet.alive = false;
  pet.health = 0;
  save();
  const stage = lifeStage();
  document.getElementById("death-text").textContent =
    `${pet.name} lived to the ${stage.name} stage (age ${Math.floor(pet.ageMin)}). Take better care next time! 🥚`;
  document.getElementById("death-overlay").classList.add("show");
}

// ===== Actions =====
function setMessage(m) { document.getElementById("message").textContent = m; }

function petDragon() {
  if (!pet.hatched) { hatch(); return; }
  if (!pet.alive || pet.sleeping) return;
  pet.happy = clamp(pet.happy + 3);
  setMessage("Your dragon loves the attention! 💜");
  bounce();
  save(); render();
}

function hatch() {
  pet.hatched = true;
  pet.born = Date.now();
  pet.lastTick = Date.now();
  setMessage("🎉 Your dragon hatched! Take good care of it.");
  bounce();
  save(); render();
}

function bounce() {
  const d = document.getElementById("dragon");
  d.style.transform = "scale(1.25)";
  setTimeout(() => { d.style.transform = ""; }, 180);
}

function guard() { return pet.hatched && pet.alive && !pet.sleeping; }

function feed() {
  if (!pet.hatched) { setMessage("Hatch your egg first! Tap it."); return; }
  if (!guard()) { setMessage("Can't do that right now 😴"); return; }
  if (pet.hunger >= 100) { setMessage("Your dragon is too full! 🤢"); return; }
  pet.hunger = clamp(pet.hunger + 25);
  pet.energy = clamp(pet.energy + 5);
  if (Math.random() < 0.4) pet.poops = Math.min(4, pet.poops + 1);
  setMessage("Nom nom! 🍖 Yummy.");
  bounce(); save(); render();
}

function playWith() {
  if (!guard()) { setMessage("Hatch or wake your dragon first!"); return; }
  if (pet.energy < 15) { setMessage("Too tired to play 😪 — let it sleep."); return; }
  pet.happy = clamp(pet.happy + 25);
  pet.energy = clamp(pet.energy - 15);
  pet.hunger = clamp(pet.hunger - 8);
  setMessage("Wheee! 🎮 So much fun!");
  bounce(); save(); render();
}

function toggleSleep() {
  if (!pet.hatched || !pet.alive) return;
  pet.sleeping = !pet.sleeping;
  setMessage(pet.sleeping ? "Shhh… your dragon is sleeping 😴" : "Your dragon woke up! ☀️");
  save(); render();
}

function clean() {
  if (!pet.hatched || !pet.alive) return;
  if (pet.poops === 0) { setMessage("Already squeaky clean! ✨"); return; }
  pet.poops = 0;
  pet.happy = clamp(pet.happy + 5);
  setMessage("All clean now! 🧹✨");
  save(); render();
}

function heal() {
  if (!pet.hatched || !pet.alive) return;
  if (pet.health >= 100) { setMessage("Your dragon is perfectly healthy! ❤️"); return; }
  pet.health = clamp(pet.health + 30);
  setMessage("Took its medicine 💊 Feeling better!");
  bounce(); save(); render();
}

function confirmReset() {
  if (confirm("Reset and start over with a new egg?")) restart();
}
function restart() {
  pet = Object.assign({}, DEFAULT, { born: Date.now(), lastTick: Date.now() });
  document.getElementById("death-overlay").classList.remove("show");
  setMessage("A fresh new egg! Tap it to hatch. 🥚");
  save(); render();
}

// ===== Render =====
function render() {
  const stage = lifeStage();
  document.getElementById("pet-name").textContent = pet.name;
  document.getElementById("pet-stage").textContent = stage.name;
  document.getElementById("pet-age").textContent = "Age: " + Math.floor(pet.ageMin);

  const d = document.getElementById("dragon");
  d.textContent = pet.hatched ? stage.emoji : "🥚";
  d.classList.toggle("sleeping", pet.sleeping);
  d.classList.toggle("sick", pet.hatched && pet.health < 30 && pet.alive);

  document.getElementById("zzz").style.display = pet.sleeping ? "block" : "none";

  // poops
  const area = document.getElementById("poop-area");
  area.innerHTML = "";
  for (let i = 0; i < pet.poops; i++) {
    const p = document.createElement("div");
    p.className = "poop";
    p.textContent = "💩";
    p.style.left = (20 + i * 45) + "px";
    area.appendChild(p);
  }

  document.getElementById("bar-hunger").style.width = pet.hunger + "%";
  document.getElementById("bar-happy").style.width  = pet.happy + "%";
  document.getElementById("bar-energy").style.width = pet.energy + "%";
  document.getElementById("bar-health").style.width = pet.health + "%";

  // disable buttons appropriately
  const dead = !pet.alive;
  document.getElementById("btn-feed").disabled  = dead;
  document.getElementById("btn-play").disabled  = dead;
  document.getElementById("btn-sleep").disabled = dead || !pet.hatched;
  document.getElementById("btn-clean").disabled = dead;
  document.getElementById("btn-heal").disabled  = dead;
}

// ===== Boot =====
tick();
render();
setInterval(tick, 3000); // update every 3 seconds
</script>
</body>
</html>
